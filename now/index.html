<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now — Kellen Sun</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/chrome.css">
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --muted: #888;
    }

    html.dark {
      --bg: #111;
      --fg: #f2f2f2;
      --muted: #777;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      color: var(--fg);
      background: var(--bg);
      transition: background 0.45s ease, color 0.45s ease;
    }

    .stack {
      text-align: center;
      max-width: 90vw;
    }

    .line {
      min-height: 1.5em;
      margin: 0;
      cursor: default;
      user-select: none;
      touch-action: manipulation;
    }

    .line i {
      font-style: italic;
    }

    .updated {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--muted);
      cursor: default;
      user-select: none;
      touch-action: manipulation;
    }

    .cursor {
      display: inline-block;
      width: 0.55ch;
      margin-left: 1px;
      background: var(--fg);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stack">
    <p class="line"><span id="text"></span><span class="cursor"></span></p>
    <p class="updated">updated Aug 2026</p>
  </div>
  <script src="/assets/chrome.js" defer></script>
  <script>
    // Segment lists: strings, or { i: "italic title" }
    var items = [
      ["Interning at Aven."],
      ["Learning parallel computing."],
      ["Reading ", { i: "What Is the Gospel?" }, " by Greg Gilbert."],
      ["Listening to ", { i: "Through the Gryffindoor" }, "."]
    ];

    var textEl = document.getElementById("text");
    var current = -1;
    var typing = false;

    function flatten(parts) {
      var out = [];
      parts.forEach(function (part) {
        if (typeof part === "string") {
          for (var i = 0; i < part.length; i++) {
            out.push({ ch: part[i], italic: false });
          }
        } else if (part && part.i) {
          for (var j = 0; j < part.i.length; j++) {
            out.push({ ch: part.i[j], italic: true });
          }
        }
      });
      return out;
    }

    function renderChars(chars) {
      var html = "";
      var inItalic = false;
      chars.forEach(function (c) {
        if (c.italic && !inItalic) {
          html += "<i>";
          inItalic = true;
        } else if (!c.italic && inItalic) {
          html += "</i>";
          inItalic = false;
        }
        html += c.ch === "<" ? "&lt;" : c.ch === "&" ? "&amp;" : c.ch;
      });
      if (inItalic) html += "</i>";
      textEl.innerHTML = html;
    }

    function pickNext() {
      if (items.length === 1) return 0;
      var next = current;
      while (next === current) {
        next = Math.floor(Math.random() * items.length);
      }
      return next;
    }

    function wait(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    async function typeText(parts) {
      var chars = flatten(parts);
      for (var i = 0; i <= chars.length; i++) {
        renderChars(chars.slice(0, i));
        await wait(38 + Math.random() * 40);
      }
    }

    async function eraseText() {
      var chars = flatten(items[current]);
      for (var i = chars.length; i >= 0; i--) {
        renderChars(chars.slice(0, i));
        await wait(22);
      }
    }

    async function loop() {
      if (typing) return;
      typing = true;
      while (true) {
        current = pickNext();
        await typeText(items[current]);
        await wait(5500);
        await eraseText();
        await wait(280);
      }
    }

    var holdTimer = null;
    var holdTargets = document.querySelectorAll(".line, .updated");

    function startHold(e) {
      if (e.type === "mousedown" && e.button !== 0) return;
      holdTimer = setTimeout(function () {
        window.location.href = "/about/";
      }, 1500);
    }

    function cancelHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
    }

    holdTargets.forEach(function (el) {
      el.addEventListener("mousedown", startHold);
      el.addEventListener("touchstart", startHold, { passive: true });
      el.addEventListener("mouseup", cancelHold);
      el.addEventListener("mouseleave", cancelHold);
      el.addEventListener("touchend", cancelHold);
      el.addEventListener("touchcancel", cancelHold);
    });

    loop();
  </script>
</body>
</html>
