<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now — Kellen Sun</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --muted: #888;
    }

    html.dark {
      --bg: #111;
      --fg: #f2f2f2;
      --muted: #777;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      color: var(--fg);
      background: var(--bg);
      transition: background 0.45s ease, color 0.45s ease;
    }

    .stack {
      text-align: center;
      max-width: 90vw;
    }

    .line {
      min-height: 1.5em;
      margin: 0;
      cursor: default;
      user-select: none;
      touch-action: manipulation;
    }

    .updated {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--muted);
      cursor: default;
      user-select: none;
      touch-action: manipulation;
    }

    .cursor {
      display: inline-block;
      width: 0.55ch;
      margin-left: 1px;
      background: var(--fg);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .corner-tr {
      position: fixed;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      z-index: 19;
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 2.5rem;
      height: 2.5rem;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      color: var(--fg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    .theme-toggle.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .theme-toggle svg {
      width: 1.35rem;
      height: 1.35rem;
      display: block;
      margin: auto;
      overflow: visible;
    }

    .theme-toggle .sun,
    .theme-toggle .moon {
      transform-origin: center;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    }

    .theme-toggle .ray {
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      transition: opacity 0.35s ease, transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }

    html:not(.dark) .theme-toggle .moon { opacity: 0; transform: scale(0.4) rotate(-30deg); }
    html:not(.dark) .theme-toggle .sun { opacity: 1; transform: scale(1); }
    html:not(.dark) .theme-toggle .ray { opacity: 1; }
    html.dark .theme-toggle .sun { opacity: 0; transform: scale(0.4) rotate(40deg); }
    html.dark .theme-toggle .moon { opacity: 1; transform: scale(1); }
    html.dark .theme-toggle .ray { opacity: 0; transform: scale(0.2); }
  </style>
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
</head>
<body>
  <div class="corner-tr" id="corner-tr" aria-hidden="true"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle class="sun" cx="12" cy="12" r="4" fill="currentColor"></circle>
      <g class="rays">
        <line class="ray" x1="12" y1="2.5" x2="12" y2="5"></line>
        <line class="ray" x1="12" y1="19" x2="12" y2="21.5"></line>
        <line class="ray" x1="2.5" y1="12" x2="5" y2="12"></line>
        <line class="ray" x1="19" y1="12" x2="21.5" y2="12"></line>
        <line class="ray" x1="4.8" y1="4.8" x2="6.6" y2="6.6"></line>
        <line class="ray" x1="17.4" y1="17.4" x2="19.2" y2="19.2"></line>
        <line class="ray" x1="4.8" y1="19.2" x2="6.6" y2="17.4"></line>
        <line class="ray" x1="17.4" y1="6.6" x2="19.2" y2="4.8"></line>
      </g>
      <path class="moon" fill="currentColor" d="M14.3 3.2a8.2 8.2 0 1 0 6.5 14.1A7 7 0 0 1 14.3 3.2z"></path>
    </svg>
  </button>
  <div class="stack">
    <p class="line"><span id="text"></span><span class="cursor"></span></p>
    <p class="updated">updated Aug 2026</p>
  </div>
  <script>
    // Edit this list anytime — one string per status update.
    var items = [
      "Interning at Aven.",
      "Learning parallel computing."
    ];

    var textEl = document.getElementById("text");
    var current = -1;
    var typing = false;

    function pickNext() {
      if (items.length === 1) return 0;
      var next = current;
      while (next === current) {
        next = Math.floor(Math.random() * items.length);
      }
      return next;
    }

    function wait(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    async function typeText(str) {
      textEl.textContent = "";
      for (var i = 0; i < str.length; i++) {
        textEl.textContent += str[i];
        await wait(38 + Math.random() * 40);
      }
    }

    async function eraseText() {
      var str = textEl.textContent;
      for (var i = str.length; i >= 0; i--) {
        textEl.textContent = str.slice(0, i);
        await wait(22);
      }
    }

    async function loop() {
      if (typing) return;
      typing = true;
      while (true) {
        current = pickNext();
        await typeText(items[current]);
        await wait(7000);
        await eraseText();
        await wait(280);
      }
    }

    var toggle = document.getElementById("theme-toggle");
    var corner = document.getElementById("corner-tr");
    var hideTimer = null;

    function showTheme() {
      clearTimeout(hideTimer);
      toggle.classList.add("visible");
    }

    function hideThemeSoon() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (!toggle.matches(":hover") && !corner.matches(":hover")) {
          toggle.classList.remove("visible");
        }
      }, 350);
    }

    corner.addEventListener("mouseenter", showTheme);
    corner.addEventListener("mouseleave", hideThemeSoon);
    toggle.addEventListener("mouseenter", showTheme);
    toggle.addEventListener("mouseleave", hideThemeSoon);
    toggle.addEventListener("click", function () {
      var dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", dark ? "dark" : "light");
    });

    // Hold any /now text ~2s → /about
    var holdTimer = null;
    var holdTargets = document.querySelectorAll(".line, .updated");

    function startHold(e) {
      if (e.type === "mousedown" && e.button !== 0) return;
      holdTimer = setTimeout(function () {
        window.location.href = "/about/";
      }, 2000);
    }

    function cancelHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
    }

    holdTargets.forEach(function (el) {
      el.addEventListener("mousedown", startHold);
      el.addEventListener("touchstart", startHold, { passive: true });
      el.addEventListener("mouseup", cancelHold);
      el.addEventListener("mouseleave", cancelHold);
      el.addEventListener("touchend", cancelHold);
      el.addEventListener("touchcancel", cancelHold);
    });

    loop();
  </script>
</body>
</html>
