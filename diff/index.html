<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diff — Kellen Sun</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/chrome.css">
  <style>
    :root {
      --bg: #f7f7f7;
      --fg: #111;
      --muted: #777;
      --box: #fff;
      --border: #ddd;
      --btn: #d8d8d8;
      --btn-hover: #c8c8c8;
      --btn-text: #333;
      --gutter: #f0f0f0;
      --gutter-fg: #999;
      --gutter-add: #b5d9b5;
      --gutter-del: #e0b0b0;
      --add-bg: #c5e5c5;
      --del-bg: #ebc4c4;
      --add-word: #8ecf8e;
      --del-word: #e09090;
    }

    html.dark {
      --bg: #111;
      --fg: #f2f2f2;
      --muted: #888;
      --box: #1a1a1a;
      --border: #333;
      --btn: #2a2a2a;
      --btn-hover: #3a3a3a;
      --btn-text: #ddd;
      --gutter: #141414;
      --gutter-fg: #666;
      --gutter-add: #243d28;
      --gutter-del: #4a2828;
      --add-bg: #243828;
      --del-bg: #3d2424;
      --add-word: #356640;
      --del-word: #7a4040;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--fg);
      background: var(--bg);
      transition: background 0.45s ease, color 0.45s ease;
    }

    .page {
      width: min(96vw, 92rem);
      margin: 0 auto;
      padding: 4.25rem 0 4rem;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      align-items: start;
    }

    .pane {
      min-width: 0;
    }

    .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
      min-height: 1.4em;
      font-size: 0.75rem;
      font-style: italic;
      color: var(--muted);
    }

    .meta .counts {
      margin-left: auto;
      text-align: right;
    }

    .meta button {
      border: 0;
      border-radius: 2px;
      background: var(--btn);
      color: var(--btn-text);
      font: inherit;
      font-size: 0.8rem;
      font-style: italic;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }

    .meta button:hover { background: var(--btn-hover); }

    .frame {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--box);
      overflow: hidden;
      --ed-pad: 1rem;
      --ed-size: 0.88rem;
      --ed-lh: 1.364rem; /* 0.88 × 1.55 — shared so gutter matches text */
    }

    .gutter {
      flex: 0 0 auto;
      min-width: 2.4rem;
      padding: var(--ed-pad) 0;
      background: var(--gutter);
      border-right: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      line-height: var(--ed-lh);
      color: var(--gutter-fg);
      text-align: right;
      user-select: none;
    }

    .gutter div {
      box-sizing: border-box;
      height: var(--ed-lh);
      padding: 0 0.45rem 0 0.55rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .gutter .add { background: var(--gutter-add); color: var(--fg); }
    .gutter .del { background: var(--gutter-del); color: var(--fg); }

    .editor {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .highlight,
    textarea {
      margin: 0;
      width: 100%;
      min-height: 14rem;
      padding: var(--ed-pad);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: var(--ed-size);
      line-height: var(--ed-lh);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      border: 0;
      tab-size: 2;
    }

    .highlight {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: var(--fg);
      background: transparent;
      overflow: hidden;
    }

    .highlight .row {
      display: block;
      min-height: var(--ed-lh);
      line-height: var(--ed-lh);
      margin: 0 calc(var(--ed-pad) * -1);
      padding: 0 var(--ed-pad);
    }

    .highlight .row.add { background: var(--add-bg); }
    .highlight .row.del { background: var(--del-bg); }

    .highlight .w-add { background: var(--add-word); }
    .highlight .w-del { background: var(--del-word); }

    textarea {
      position: relative;
      z-index: 1;
      display: block;
      resize: none;
      background: transparent;
      color: transparent;
      caret-color: var(--fg);
      outline: none;
      overflow: hidden;
    }

    @media (max-width: 720px) {
      .cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="cols">
    <div class="pane">
      <div class="meta">
        <button type="button" id="clear">clear</button>
        <span class="counts" id="left-count">0 lines · 0 words · 0 chars</span>
      </div>
      <div class="frame">
        <div class="gutter" id="left-gutter">1</div>
        <div class="editor">
          <pre class="highlight" id="left-hl" aria-hidden="true"></pre>
          <textarea id="left" spellcheck="false" placeholder="paste original…"></textarea>
        </div>
      </div>
    </div>
    <div class="pane">
      <div class="meta">
        <span class="counts" id="right-count">0 lines · 0 words · 0 chars</span>
      </div>
      <div class="frame">
        <div class="gutter" id="right-gutter">1</div>
        <div class="editor">
          <pre class="highlight" id="right-hl" aria-hidden="true"></pre>
          <textarea id="right" spellcheck="false" placeholder="paste changed…"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/chrome.js" defer></script>
<script>
  var STORAGE_KEY = "diff-panes";
  var leftTa = document.getElementById("left");
  var rightTa = document.getElementById("right");
  var leftHl = document.getElementById("left-hl");
  var rightHl = document.getElementById("right-hl");
  var leftCount = document.getElementById("left-count");
  var rightCount = document.getElementById("right-count");
  var leftGutter = document.getElementById("left-gutter");
  var rightGutter = document.getElementById("right-gutter");

  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function countStats(text) {
    var chars = text.length;
    var lines = text === "" ? 0 : text.split("\n").length;
    var trimmed = text.trim();
    var words = trimmed ? trimmed.split(/\s+/).length : 0;
    return (
      lines + " line" + (lines === 1 ? "" : "s") +
      " · " + words + " word" + (words === 1 ? "" : "s") +
      " · " + chars + " char" + (chars === 1 ? "" : "s")
    );
  }

  function renderGutter(el, marks) {
    el.innerHTML = marks.map(function (m, i) {
      var cls = m === "add" || m === "del" ? ' class="' + m + '"' : "";
      return "<div" + cls + ">" + (i + 1) + "</div>";
    }).join("") || "<div>1</div>";
  }

  function splitWords(line) {
    return line.match(/\S+|\s+/g) || [];
  }

  function lcsTable(a, b) {
    var m = a.length;
    var n = b.length;
    var dp = Array(m + 1);
    for (var i = 0; i <= m; i++) {
      dp[i] = Array(n + 1).fill(0);
    }
    for (i = 1; i <= m; i++) {
      for (var j = 1; j <= n; j++) {
        if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
        else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp;
  }

  function diffSeq(a, b) {
    var dp = lcsTable(a, b);
    var out = [];
    var i = a.length;
    var j = b.length;
    while (i > 0 && j > 0) {
      if (a[i - 1] === b[j - 1]) {
        out.push({ type: "eq", a: a[i - 1], b: b[j - 1] });
        i--;
        j--;
      } else if (dp[i - 1][j] >= dp[i][j - 1]) {
        out.push({ type: "del", a: a[i - 1] });
        i--;
      } else {
        out.push({ type: "add", b: b[j - 1] });
        j--;
      }
    }
    while (i > 0) {
      out.push({ type: "del", a: a[i - 1] });
      i--;
    }
    while (j > 0) {
      out.push({ type: "add", b: b[j - 1] });
      j--;
    }
    out.reverse();
    return out;
  }

  function wordDiffHtml(leftLine, rightLine) {
    var ops = diffSeq(splitWords(leftLine), splitWords(rightLine));
    var leftHtml = "";
    var rightHtml = "";
    ops.forEach(function (op) {
      if (op.type === "eq") {
        leftHtml += escapeHtml(op.a);
        rightHtml += escapeHtml(op.b);
      } else if (op.type === "del") {
        leftHtml += '<span class="w-del">' + escapeHtml(op.a) + "</span>";
      } else {
        rightHtml += '<span class="w-add">' + escapeHtml(op.b) + "</span>";
      }
    });
    return { left: leftHtml, right: rightHtml };
  }

  // Highlight mirrors textarea 1:1 (no spacer rows). Within a hunk of
  // adds/dels, pair lines for word-diff so "1 word + trailing newline"
  // doesn't paint whole lines red/green.
  function renderSides(leftText, rightText) {
    var a = leftText.split("\n");
    var b = rightText.split("\n");
    var ops = diffSeq(a, b);
    var leftRows = [];
    var rightRows = [];
    var leftMarks = [];
    var rightMarks = [];
    var i = 0;

    while (i < ops.length) {
      if (ops[i].type === "eq") {
        leftRows.push('<span class="row">' + (escapeHtml(ops[i].a) || "&nbsp;") + "</span>");
        rightRows.push('<span class="row">' + (escapeHtml(ops[i].b) || "&nbsp;") + "</span>");
        leftMarks.push("");
        rightMarks.push("");
        i++;
        continue;
      }

      var dels = [];
      var adds = [];
      while (i < ops.length && ops[i].type !== "eq") {
        if (ops[i].type === "del") dels.push(ops[i].a);
        else adds.push(ops[i].b);
        i++;
      }

      var paired = Math.min(dels.length, adds.length);
      var k;
      for (k = 0; k < paired; k++) {
        var parts = wordDiffHtml(dels[k], adds[k]);
        leftRows.push('<span class="row">' + (parts.left || "&nbsp;") + "</span>");
        rightRows.push('<span class="row">' + (parts.right || "&nbsp;") + "</span>");
        leftMarks.push("chg");
        rightMarks.push("chg");
      }
      for (k = paired; k < dels.length; k++) {
        leftRows.push('<span class="row del">' + (escapeHtml(dels[k]) || "&nbsp;") + "</span>");
        leftMarks.push("del");
      }
      for (k = paired; k < adds.length; k++) {
        rightRows.push('<span class="row add">' + (escapeHtml(adds[k]) || "&nbsp;") + "</span>");
        rightMarks.push("add");
      }
    }

    return {
      left: leftRows.join("") || '<span class="row">&nbsp;</span>',
      right: rightRows.join("") || '<span class="row">&nbsp;</span>',
      leftMarks: leftMarks.length ? leftMarks : [""],
      rightMarks: rightMarks.length ? rightMarks : [""]
    };
  }

  function fitPane(ta, hl, gutter) {
    ta.style.height = "0px";
    ta.style.height = ta.scrollHeight + "px";
    hl.style.height = ta.style.height;
    gutter.style.minHeight = ta.style.height;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        left: leftTa.value,
        right: rightTa.value
      }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (typeof data.left === "string") leftTa.value = data.left;
      if (typeof data.right === "string") rightTa.value = data.right;
    } catch (e) {}
  }

  function update() {
    var left = leftTa.value;
    var right = rightTa.value;
    leftCount.textContent = countStats(left);
    rightCount.textContent = countStats(right);

    var sides = renderSides(left, right);
    leftHl.innerHTML = sides.left;
    rightHl.innerHTML = sides.right;
    renderGutter(leftGutter, sides.leftMarks);
    renderGutter(rightGutter, sides.rightMarks);

    fitPane(leftTa, leftHl, leftGutter);
    fitPane(rightTa, rightHl, rightGutter);
    save();
  }

  leftTa.addEventListener("input", update);
  rightTa.addEventListener("input", update);

  leftTa.addEventListener("scroll", function () {
    leftHl.scrollTop = leftTa.scrollTop;
    leftGutter.scrollTop = leftTa.scrollTop;
  });
  rightTa.addEventListener("scroll", function () {
    rightHl.scrollTop = rightTa.scrollTop;
    rightGutter.scrollTop = rightTa.scrollTop;
  });

  document.getElementById("clear").addEventListener("click", function () {
    leftTa.value = "";
    rightTa.value = "";
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    leftTa.focus();
    update();
  });

  load();
  update();
</script>
</body>
</html>
