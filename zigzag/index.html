<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zig Zag</title>
  <script src="script.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body onload="init('Press up to start, left or right to steer the line.');" onblur="gameOver()" onkeydown="handleKey(event)">
  <div id="wrap">
    <div id="game" onmousedown="handleTap(event.clientX)"></div>
    <div id="chrome">
      <p class="my-record">My record 1:32</p>
      <button type="button" id="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen</button>
      <p class="credit">Credit: <a href="https://vladimirslepnev.itch.io/zigzag" target="_blank" rel="noopener">vladimirslepnev.itch.io/zigzag</a></p>
    </div>
  </div>
</body>
</html>
