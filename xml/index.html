<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XML — Kellen Sun</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/chrome.css">
  <style>
    :root {
      --bg: #f7f7f7;
      --fg: #111;
      --muted: #777;
      --box: #fff;
      --border: #ddd;
      --btn: #d8d8d8;
      --btn-hover: #c8c8c8;
      --btn-text: #333;
      --err: #b33;
    }

    html.dark {
      --bg: #111;
      --fg: #f2f2f2;
      --muted: #888;
      --box: #1a1a1a;
      --border: #333;
      --btn: #2a2a2a;
      --btn-hover: #3a3a3a;
      --btn-text: #ddd;
      --err: #f88;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--fg);
      background: var(--bg);
      transition: background 0.45s ease, color 0.45s ease;
    }

    .page {
      width: min(66.666vw, 48rem);
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: normal;
      font-style: italic;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .actions button {
      border: 0;
      border-radius: 2px;
      background: var(--btn);
      color: var(--btn-text);
      font: inherit;
      font-size: 0.8rem;
      font-style: italic;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }

    .actions button:hover { background: var(--btn-hover); }

    .pane {
      position: relative;
    }

    textarea,
    .tree {
      display: block;
      width: 100%;
      min-height: 60vh;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--box);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.45;
      padding: 1rem;
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    .pane.tree-on textarea { display: none; }
    .pane:not(.tree-on) .tree { display: none; }

    .tree {
      overflow: auto;
      padding: 1rem 1rem 1rem 0.45rem;
      white-space: nowrap;
      user-select: text;
    }

    .node {
      position: relative;
      padding-left: 1.05rem;
    }

    .toggle {
      position: absolute;
      left: 0;
      top: 0.12em;
      width: 1rem;
      height: 1.2em;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.16s ease;
    }

    .node:has(> .line:hover) > .toggle,
    .node.collapsed > .toggle,
    .node:has(> .toggle:focus) > .toggle {
      opacity: 1;
    }

    .toggle::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      margin: 0.35em auto 0;
      border-style: solid;
      border-width: 4px 0 4px 6px;
      border-color: transparent transparent transparent currentColor;
      transform: rotate(90deg);
      transition: transform 0.16s ease;
    }

    .node.collapsed > .toggle::before {
      transform: rotate(0deg);
    }

    .kids { margin: 0; }
    .node.collapsed > .kids,
    .node.collapsed > .end { display: none; }
    .preview { display: none; color: var(--muted); font-style: italic; }
    .node.collapsed > .line .preview { display: inline; }

    .muted { color: var(--muted); }

    .status {
      margin: 0.65rem 0 0;
      min-height: 1.2em;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--muted);
    }

    .status.error { color: var(--err); }
  </style>
</head>
<body>
<div class="page">
    <header>
      <h1>xml</h1>
      <div class="actions">
        <button type="button" id="format">format</button>
        <button type="button" id="minify">minify</button>
        <button type="button" id="copy">copy</button>
        <button type="button" id="clear">clear</button>
      </div>
    </header>
    <div class="pane" id="pane">
      <textarea id="input" spellcheck="false"></textarea>
      <div class="tree" id="tree" aria-label="Formatted XML"></div>
    </div>
    <p class="status" id="status"></p>
  </div>

  <script>
    (function () {
      var input = document.getElementById("input");
      var tree = document.getElementById("tree");
      var pane = document.getElementById("pane");
      var status = document.getElementById("status");
      var STORAGE_KEY = "xml-input";

      function setStatus(msg, isError) {
        status.textContent = msg || "";
        status.classList.toggle("error", !!isError);
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, input.value); } catch (e) {}
      }

      function load() {
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored) input.value = stored;
        } catch (e) {}
      }

      function parse() {
        var raw = input.value.trim();
        if (!raw) {
          setStatus("");
          return null;
        }
        var doc = new DOMParser().parseFromString(raw, "application/xml");
        var err = doc.getElementsByTagName("parsererror")[0];
        if (err) {
          var msg = (err.textContent || "invalid xml").replace(/\s+/g, " ").trim();
          setStatus(msg, true);
          return undefined;
        }
        return doc;
      }

      function escapeAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");
      }

      function escapeText(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function attrs(elNode) {
        var out = "";
        for (var i = 0; i < elNode.attributes.length; i++) {
          var a = elNode.attributes[i];
          out += " " + a.name + "=\"" + escapeAttr(a.value) + "\"";
        }
        return out;
      }

      function isIgnorableText(node) {
        return node.nodeType === 3 && !node.nodeValue.replace(/\s+/g, "");
      }

      function realChildren(elNode) {
        var kids = [];
        for (var i = 0; i < elNode.childNodes.length; i++) {
          var n = elNode.childNodes[i];
          if (!isIgnorableText(n)) kids.push(n);
        }
        return kids;
      }

      function serialize(node, pretty, depth) {
        var pad = pretty ? Array(depth + 1).join("  ") : "";
        var nl = pretty ? "\n" : "";

        if (node.nodeType === 9) {
          var out = "";
          if (node.xmlVersion && node.xmlEncoding) {
            out += "<?xml version=\"" + node.xmlVersion + "\" encoding=\"" + node.xmlEncoding + "\"?>" + nl;
          } else if (/<\?xml\b/i.test(input.value)) {
            out += "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" + nl;
          }
          for (var i = 0; i < node.childNodes.length; i++) {
            var child = node.childNodes[i];
            if (child.nodeType === 10) continue;
            if (isIgnorableText(child)) continue;
            if (out && pretty && out.slice(-1) !== "\n") out += nl;
            out += serialize(child, pretty, 0);
            if (pretty && out.slice(-1) !== "\n") out += nl;
          }
          return out.replace(/\n+$/, pretty ? "\n" : "");
        }

        if (node.nodeType === 8) {
          return pad + "<!--" + node.nodeValue + "-->";
        }

        if (node.nodeType === 7) {
          return pad + "<?" + node.nodeName + (node.nodeValue ? " " + node.nodeValue : "") + "?>";
        }

        if (node.nodeType === 4) {
          return pad + "<![CDATA[" + node.nodeValue + "]]>";
        }

        if (node.nodeType === 3) {
          var text = pretty ? node.nodeValue.trim() : node.nodeValue.replace(/\s+/g, " ").trim();
          return text ? (pretty ? pad + escapeText(text) : escapeText(text)) : "";
        }

        if (node.nodeType !== 1) return "";

        var kids = realChildren(node);
        var open = "<" + node.tagName + attrs(node);
        if (!kids.length) return pad + open + "/>";

        var onlyText = kids.length === 1 && kids[0].nodeType === 3;
        if (onlyText) {
          var inner = pretty ? kids[0].nodeValue.trim() : kids[0].nodeValue.replace(/\s+/g, " ").trim();
          return pad + open + ">" + escapeText(inner) + "</" + node.tagName + ">";
        }

        if (!pretty) {
          var compact = open + ">";
          kids.forEach(function (k) { compact += serialize(k, false, 0); });
          return compact + "</" + node.tagName + ">";
        }

        var prettyOut = pad + open + ">" + nl;
        kids.forEach(function (k) {
          prettyOut += serialize(k, true, depth + 1) + nl;
        });
        return prettyOut + pad + "</" + node.tagName + ">";
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function bindToggle(wrap) {
        var btn = el("button", "toggle");
        btn.type = "button";
        btn.title = "Collapse";
        btn.setAttribute("aria-label", "Collapse");
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          wrap.classList.toggle("collapsed");
          var closed = wrap.classList.contains("collapsed");
          btn.title = closed ? "Expand" : "Collapse";
          btn.setAttribute("aria-label", closed ? "Expand" : "Collapse");
        });
        wrap.appendChild(btn);
      }

      function buildXml(node) {
        if (node.nodeType === 8) {
          return el("div", "node muted", "<!--" + node.nodeValue + "-->");
        }
        if (node.nodeType === 7) {
          return el("div", "node muted", "<?" + node.nodeName + (node.nodeValue ? " " + node.nodeValue : "") + "?>");
        }
        if (node.nodeType === 4) {
          return el("div", "node", "<![CDATA[" + node.nodeValue + "]]>");
        }
        if (node.nodeType === 3) {
          var t = node.nodeValue.trim();
          return t ? el("div", "node", t) : null;
        }
        if (node.nodeType !== 1) return null;

        var kids = realChildren(node);
        var wrap = el("div", "node");
        var line = el("div", "line");
        var open = "<" + node.tagName + attrs(node);
        var onlyText = kids.length === 1 && kids[0].nodeType === 3;
        var collapsible = kids.length > 0 && !onlyText;

        if (collapsible) bindToggle(wrap);

        if (!kids.length) {
          line.textContent = open + "/>";
          wrap.appendChild(line);
          return wrap;
        }

        if (onlyText) {
          line.textContent = open + ">" + kids[0].nodeValue.trim() + "</" + node.tagName + ">";
          wrap.appendChild(line);
          return wrap;
        }

        line.appendChild(document.createTextNode(open + ">"));
        var preview = el("span", "preview", " … ");
        line.appendChild(preview);
        line.appendChild(el("span", "preview", "</" + node.tagName + ">"));
        wrap.appendChild(line);

        var kidsEl = el("div", "kids");
        kids.forEach(function (k) {
          var child = buildXml(k);
          if (child) kidsEl.appendChild(child);
        });
        wrap.appendChild(kidsEl);

        var end = el("div", "end node");
        end.style.paddingLeft = "1.05rem";
        end.appendChild(el("div", "line", "</" + node.tagName + ">"));
        wrap.appendChild(end);
        return wrap;
      }

      function showTree(doc) {
        var frag = document.createDocumentFragment();
        if (doc.xmlVersion && doc.xmlEncoding) {
          frag.appendChild(el("div", "node muted", "<?xml version=\"" + doc.xmlVersion + "\" encoding=\"" + doc.xmlEncoding + "\"?>"));
        } else if (/<\?xml\b/i.test(input.value)) {
          frag.appendChild(el("div", "node muted", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"));
        }
        for (var i = 0; i < doc.childNodes.length; i++) {
          var child = doc.childNodes[i];
          if (child.nodeType === 10) continue;
          if (isIgnorableText(child)) continue;
          var built = buildXml(child);
          if (built) frag.appendChild(built);
        }
        tree.replaceChildren(frag);
        pane.classList.add("tree-on");
      }

      function showEditor() {
        pane.classList.remove("tree-on");
      }

      document.getElementById("format").addEventListener("click", function () {
        var doc = parse();
        if (doc === undefined || doc === null) return;
        input.value = serialize(doc, true, 0);
        save();
        showTree(doc);
        setStatus("formatted");
      });

      document.getElementById("minify").addEventListener("click", function () {
        var doc = parse();
        if (doc === undefined || doc === null) return;
        input.value = serialize(doc, false, 0);
        save();
        showEditor();
        setStatus("minified");
      });

      document.getElementById("copy").addEventListener("click", function () {
        navigator.clipboard.writeText(input.value).then(function () {
          setStatus("copied");
        });
      });

      document.getElementById("clear").addEventListener("click", function () {
        input.value = "";
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        showEditor();
        setStatus("");
        input.focus();
      });

      input.addEventListener("input", function () {
        showEditor();
        save();
      });

      tree.addEventListener("dblclick", function () {
        showEditor();
        input.focus();
      });

      input.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          e.preventDefault();
          document.getElementById("format").click();
        }
      });

      load();
      var loaded = parse();
      if (loaded && input.value.indexOf("\n") !== -1) {
        showTree(loaded);
      }
    })();
  </script>
  <script src="/assets/chrome.js" defer></script>
</body>
</html>
