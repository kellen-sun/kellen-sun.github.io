<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON — Kellen Sun</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/chrome.css">
  <style>
    :root {
      --bg: #f7f7f7;
      --fg: #111;
      --muted: #777;
      --box: #fff;
      --border: #ddd;
      --btn: #d8d8d8;
      --btn-hover: #c8c8c8;
      --btn-text: #333;
      --err: #b33;
    }

    html.dark {
      --bg: #111;
      --fg: #f2f2f2;
      --muted: #888;
      --box: #1a1a1a;
      --border: #333;
      --btn: #2a2a2a;
      --btn-hover: #3a3a3a;
      --btn-text: #ddd;
      --err: #f88;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--fg);
      background: var(--bg);
      transition: background 0.45s ease, color 0.45s ease;
    }

    .page {
      width: min(66.666vw, 48rem);
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: normal;
      font-style: italic;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .actions button {
      border: 0;
      border-radius: 2px;
      background: var(--btn);
      color: var(--btn-text);
      font: inherit;
      font-size: 0.8rem;
      font-style: italic;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }

    .actions button:hover { background: var(--btn-hover); }

    .pane {
      position: relative;
    }

    textarea,
    .tree {
      display: block;
      width: 100%;
      min-height: 60vh;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--box);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.45;
      padding: 1rem;
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    .pane.tree-on textarea { display: none; }
    .pane:not(.tree-on) .tree { display: none; }

    .tree {
      overflow: auto;
      padding: 1rem 1rem 1rem 0.45rem;
      white-space: nowrap;
      user-select: text;
    }

    .node {
      position: relative;
      padding-left: 1.05rem;
    }

    .toggle {
      position: absolute;
      left: 0;
      top: 0.12em;
      width: 1rem;
      height: 1.2em;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.16s ease;
    }

    .node:has(> .line:hover) > .toggle,
    .node.collapsed > .toggle,
    .node:has(> .toggle:focus-visible) > .toggle {
      opacity: 1;
    }

    .toggle::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      margin: 0.35em auto 0;
      border-style: solid;
      border-width: 4px 0 4px 6px;
      border-color: transparent transparent transparent currentColor;
      transform: rotate(90deg);
      transition: transform 0.16s ease;
    }

    .node.collapsed > .toggle::before {
      transform: rotate(0deg);
    }

    .kids { margin: 0; }
    .node.collapsed > .kids,
    .node.collapsed > .end { display: none; }
    .preview { display: none; color: var(--muted); font-style: italic; }
    .node.collapsed > .line .preview { display: inline; }

    .key { color: var(--muted); }
    .punct { color: var(--muted); }

    .status {
      margin: 0.65rem 0 0;
      min-height: 1.2em;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--muted);
    }

    .status.error { color: var(--err); }
  </style>
</head>
<body>
<div class="page">
    <header>
      <h1>json</h1>
      <div class="actions">
        <button type="button" id="format">format</button>
        <button type="button" id="minify">minify</button>
        <button type="button" id="copy">copy</button>
        <button type="button" id="clear">clear</button>
      </div>
    </header>
    <div class="pane" id="pane">
      <textarea id="input" spellcheck="false"></textarea>
      <div class="tree" id="tree" aria-label="Formatted JSON"></div>
    </div>
    <p class="status" id="status"></p>
  </div>

  <script>
    (function () {
      var input = document.getElementById("input");
      var tree = document.getElementById("tree");
      var pane = document.getElementById("pane");
      var status = document.getElementById("status");
      var STORAGE_KEY = "json-input";

      function setStatus(msg, isError) {
        status.textContent = msg || "";
        status.classList.toggle("error", !!isError);
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, input.value); } catch (e) {}
      }

      function load() {
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored) input.value = stored;
        } catch (e) {}
      }

      function parse() {
        var raw = input.value.trim();
        if (!raw) {
          setStatus("");
          return null;
        }
        try {
          return JSON.parse(raw);
        } catch (e) {
          setStatus(e.message, true);
          return undefined;
        }
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function isOpen(v) {
        return v !== null && typeof v === "object" && (Array.isArray(v) ? v.length : Object.keys(v).length) > 0;
      }

      function sizeLabel(v) {
        if (Array.isArray(v)) {
          var n = v.length;
          return n + (n === 1 ? " item" : " items");
        }
        var k = Object.keys(v).length;
        return k + (k === 1 ? " key" : " keys");
      }

      function leaf(v) {
        if (v === null) return el("span", "leaf", "null");
        if (typeof v === "string") return el("span", "leaf", JSON.stringify(v));
        return el("span", "leaf", String(v));
      }

      function buildNode(key, value, comma) {
        var wrap = el("div", "node");
        var line = el("div", "line");
        var open = isOpen(value);

        if (open) {
          var btn = el("button", "toggle");
          btn.type = "button";
          btn.title = "Collapse";
          btn.setAttribute("aria-label", "Collapse");
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            wrap.classList.toggle("collapsed");
            var closed = wrap.classList.contains("collapsed");
            btn.title = closed ? "Expand" : "Collapse";
            btn.setAttribute("aria-label", closed ? "Expand" : "Collapse");
          });
          wrap.appendChild(btn);
        }

        if (key !== undefined) {
          line.appendChild(el("span", "key", JSON.stringify(key)));
          line.appendChild(el("span", "punct", ": "));
        }

        if (!open) {
          if (value !== null && typeof value === "object") {
            line.appendChild(el("span", "punct", Array.isArray(value) ? "[]" : "{}"));
          } else {
            line.appendChild(leaf(value));
          }
          if (comma) line.appendChild(el("span", "punct", ","));
          wrap.appendChild(line);
          return wrap;
        }

        var isArr = Array.isArray(value);
        line.appendChild(el("span", "punct", isArr ? "[" : "{"));
        var preview = el("span", "preview", " " + sizeLabel(value) + " ");
        line.appendChild(preview);
        line.appendChild(el("span", "punct preview", isArr ? "]" : "}"));
        if (comma) line.appendChild(el("span", "punct preview", ","));
        wrap.appendChild(line);

        var kids = el("div", "kids");
        var entries = isArr
          ? value.map(function (item) { return [undefined, item]; })
          : Object.keys(value).map(function (k) { return [k, value[k]]; });
        entries.forEach(function (entry, i) {
          kids.appendChild(buildNode(entry[0], entry[1], i < entries.length - 1));
        });
        wrap.appendChild(kids);

        var end = el("div", "end node");
        end.style.paddingLeft = "1.05rem";
        var endLine = el("div", "line");
        endLine.appendChild(el("span", "punct", isArr ? "]" : "}"));
        if (comma) endLine.appendChild(el("span", "punct", ","));
        end.appendChild(endLine);
        wrap.appendChild(end);
        return wrap;
      }

      function showTree(data) {
        tree.replaceChildren(buildNode(undefined, data, false));
        pane.classList.add("tree-on");
      }

      function showEditor() {
        pane.classList.remove("tree-on");
      }

      document.getElementById("format").addEventListener("click", function () {
        var data = parse();
        if (data === undefined) return;
        if (data === null) return;
        input.value = JSON.stringify(data, null, 2);
        save();
        showTree(data);
        setStatus("formatted");
      });

      document.getElementById("minify").addEventListener("click", function () {
        var data = parse();
        if (data === undefined) return;
        if (data === null) return;
        input.value = JSON.stringify(data);
        save();
        showEditor();
        setStatus("minified");
      });

      document.getElementById("copy").addEventListener("click", function () {
        navigator.clipboard.writeText(input.value).then(function () {
          setStatus("copied");
        });
      });

      document.getElementById("clear").addEventListener("click", function () {
        input.value = "";
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        showEditor();
        setStatus("");
        input.focus();
      });

      input.addEventListener("input", function () {
        showEditor();
        save();
      });

      tree.addEventListener("dblclick", function () {
        showEditor();
        input.focus();
      });

      input.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          e.preventDefault();
          document.getElementById("format").click();
        }
      });

      load();
      var loaded = parse();
      if (loaded !== undefined && loaded !== null && input.value.indexOf("\n") !== -1) {
        showTree(loaded);
      }
    })();
  </script>
  <script src="/assets/chrome.js" defer></script>
</body>
</html>
